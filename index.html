<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Photoshare & Pi U Gallery Zoom</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QRCode Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Outfit', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-300">

    <!-- ================= 1. OPERATOR / BOOTH VIEW ================= -->
    <div id="operatorView" class="flex flex-col flex-1 min-h-full">
        <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 px-4 sm:px-8 py-3.5 shadow-xs">
            <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-violet-600 to-indigo-500 flex items-center justify-center text-white shadow-md">
                        <i class="fa-solid fa-camera-rotate text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-display font-bold text-lg text-slate-900 dark:text-white tracking-tight flex items-center gap-2">
                            Realtime Photoshare <span class="px-2 py-0.5 rounded-full text-[10px] bg-violet-100 text-violet-700 font-semibold uppercase">Pi U Style</span>
                        </h1>
                        <p class="text-xs text-slate-500">Live Camera & Pi U Blur Background Engine</p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="openGuestViewLink()" class="px-3.5 py-2 rounded-xl bg-violet-50 dark:bg-violet-950 border border-violet-200 dark:border-violet-800 text-violet-700 dark:text-violet-300 text-xs font-semibold hover:bg-violet-100 transition flex items-center gap-2">
                        <i class="fa-solid fa-globe"></i> Salin Link Galeri Tamu
                    </button>
                    <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition">
                        <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto w-full p-4 sm:p-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Left: Camera -->
            <div class="lg:col-span-7 flex flex-col gap-6">
                <div class="bg-white dark:bg-slate-900 rounded-3xl p-4 sm:p-6 shadow-xl border border-slate-100 dark:border-slate-800 flex flex-col relative overflow-hidden">
                    <div class="relative w-full aspect-[16/10] bg-slate-950 rounded-2xl overflow-hidden shadow-inner flex items-center justify-center">
                        <video id="webcamVideo" autoplay playsinline muted class="w-full h-full object-cover transform scale-x-[-1]"></video>
                        <canvas id="hiddenSnapshotCanvas" class="hidden"></canvas>
                        <div id="flashOverlay" class="absolute inset-0 bg-white opacity-0 pointer-events-none transition-opacity duration-100 z-30"></div>
                        <div id="countdownOverlay" class="absolute inset-0 bg-slate-950/70 hidden items-center justify-center z-20">
                            <span id="countdownNumber" class="font-display font-extrabold text-white text-8xl animate-bounce">3</span>
                        </div>
                    </div>

                    <!-- Custom Footer Text Input -->
                    <div class="mt-5 pt-4 border-t border-slate-100 dark:border-slate-800 grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-semibold text-slate-500 block mb-1">Teks Footer Kiri (Tanggal/Waktu)</label>
                            <input type="text" id="footerLeftText" value="Sabtu, 03 Oktober 2026" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-500 block mb-1">Teks Footer Tengah (Nama Acara)</label>
                            <input type="text" id="footerCenterText" value="The Wedding of Firdha & Halim" class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl">
                        </div>
                    </div>

                    <!-- Shutter Control -->
                    <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                        <select id="timerDelay" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-700 dark:text-slate-300 font-medium">
                            <option value="0">Instan (0 Detik)</option>
                            <option value="3" selected>3 Detik</option>
                        </select>
                        <button onclick="triggerCaptureSequence()" class="px-8 py-3.5 rounded-2xl bg-gradient-to-r from-violet-600 to-indigo-600 text-white font-display font-bold text-base shadow-lg shadow-violet-500/25 flex items-center gap-3">
                            <i class="fa-solid fa-camera"></i> Ambil Foto Sekarang
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right: Gallery Feed -->
            <div class="lg:col-span-5 flex flex-col gap-6">
                <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-xl border border-slate-100 dark:border-slate-800 flex flex-col flex-1 min-h-[500px]">
                    <div class="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800 mb-4">
                        <h3 class="font-display font-bold text-slate-900 dark:text-white text-base flex items-center gap-2">
                            <i class="fa-solid fa-bolt text-amber-500"></i> Galeri Real-time Feed
                        </h3>
                        <span id="photoCountBadge" class="px-2.5 py-0.5 rounded-full bg-violet-100 dark:bg-violet-950 text-violet-700 dark:text-violet-300 text-xs font-bold">0</span>
                    </div>
                    <div id="galleryStreamContainer" class="grid grid-cols-2 gap-3 overflow-y-auto max-h-[520px] pr-1 flex-1 items-start">
                        <div id="emptyFeedState" class="col-span-2 text-center py-16 text-slate-400 flex flex-col items-center gap-3">
                            <i class="fa-solid fa-images text-3xl"></i>
                            <p class="text-xs">Belum ada foto masuk.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ================= 2. GUEST / PUBLIC GALLERY VIEW (TAMPILAN TAMU ZOOMABLE) ================= -->
    <div id="guestView" class="hidden flex-col flex-1 min-h-full bg-slate-950 text-slate-100">
        <!-- Header Tamu -->
        <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 py-6 px-4 text-center sticky top-0 z-40 shadow-md">
            <div class="max-w-4xl mx-auto space-y-1">
                <h1 id="guestEventTitle" class="font-display font-extrabold text-2xl sm:text-3xl tracking-tight text-white">
                    The Wedding of Firdha & Halim
                </h1>
                <p class="text-xs sm:text-sm text-violet-400 font-medium">
                    ✨ Pi U Live Photobooth Gallery • Klik foto untuk memperbesar & mengunduh.
                </p>
            </div>
        </header>

        <!-- Guest Gallery Grid -->
        <main class="max-w-6xl mx-auto w-full p-4 sm:p-8 flex-1">
            <div class="flex items-center justify-between mb-6">
                <h2 class="font-display font-bold text-lg text-slate-300">📸 Daftar Foto Acara</h2>
                <button onclick="switchBackToOperator()" class="text-xs text-slate-400 hover:text-white underline">Kembali ke Booth Operator</button>
            </div>
            <div id="guestGalleryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <!-- Foto Tamu Masuk Disini -->
            </div>
        </main>
    </div>

    <!-- ================= 3. FULLSCREEN LIGHTBOX ZOOM MODAL (TAMPILAN DIPERBESAR & DOWNLOAD) ================= -->
    <div id="lightboxModal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md hidden flex-col items-center justify-center z-50 p-4 sm:p-8">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 w-12 h-12 rounded-full bg-slate-800/80 hover:bg-slate-700 text-white flex items-center justify-center text-xl transition z-50 shadow-lg">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="max-w-4xl w-full flex flex-col items-center gap-5 relative animate-in zoom-in-95 duration-200">
            <!-- Gambar Diperbesar -->
            <img id="lightboxImage" src="" class="max-h-[75vh] w-auto object-contain rounded-2xl shadow-2xl border border-slate-800">
            
            <!-- Tombol Aksi di Bawah Foto Zoom -->
            <div class="flex items-center gap-4 w-full sm:w-auto justify-center">
                <a id="lightboxDownloadBtn" href="" download="photobooth.jpg" class="px-8 py-3.5 bg-violet-600 hover:bg-violet-700 text-white font-display font-bold text-sm rounded-2xl transition shadow-lg shadow-violet-600/30 flex items-center gap-2.5">
                    <i class="fa-solid fa-download text-base"></i> Unduh Foto High-Res (.jpg)
                </a>
            </div>
        </div>
    </div>

    <!-- Modal QR -->
    <div id="qrModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-800 flex flex-col items-center gap-5 relative">
            <button onclick="closeQrModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="font-display font-bold text-lg text-white">QR Code Foto</h3>
            <div id="qrcodeBox" class="p-3 bg-white rounded-2xl shadow-inner"></div>
            <button onclick="downloadSinglePhoto()" class="w-full py-3 rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-semibold text-sm shadow-md">
                <i class="fa-solid fa-download"></i> Unduh Foto (.jpg)
            </button>
        </div>
    </div>

    <!-- Script Utama -->
    <script>
        let videoStream = null;
        let capturedPhotosList = [];
        let activePhotoForQr = null;

        const videoElement = document.getElementById('webcamVideo');
        const hiddenSnapshotCanvas = document.getElementById('hiddenSnapshotCanvas');
        const galleryStreamContainer = document.getElementById('galleryStreamContainer');
        const emptyFeedState = document.getElementById('emptyFeedState');
        const photoCountBadge = document.getElementById('photoCountBadge');

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const viewMode = urlParams.get('view');
            const customTitle = urlParams.get('title');

            if (customTitle) {
                document.getElementById('guestEventTitle').innerText = decodeURIComponent(customTitle);
            }

            if (viewMode === 'guest') {
                document.getElementById('operatorView').classList.add('hidden');
                document.getElementById('guestView').classList.remove('hidden');
                document.getElementById('guestView').classList.add('flex');
                loadGuestPhotosFromStorage();
            } else {
                initCamera('user');
            }
        });

        function openGuestViewLink() {
            const eventName = document.getElementById('footerCenterText').value || "The Wedding of Firdha & Halim";
            const encodedTitle = encodeURIComponent(eventName);
            const publicLink = window.location.origin + window.location.pathname + `?view=guest&title=${encodedTitle}`;
            
            navigator.clipboard.writeText(publicLink);
            alert("Link Galeri Tamu berhasil disalin!\n\nURL: " + publicLink);
        }

        function switchBackToOperator() {
            window.location.href = window.location.pathname;
        }

        async function initCamera(facingMode) {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode, width: 1280, height: 720 }, audio: false });
                videoElement.srcObject = videoStream;
            } catch (err) {
                console.error("Kamera gagal:", err);
            }
        }

        function triggerCaptureSequence() {
            executeSnapshot();
        }

        function executeSnapshot() {
            hiddenSnapshotCanvas.width = 1400;
            hiddenSnapshotCanvas.height = 950;
            const ctx = hiddenSnapshotCanvas.getContext('2d');

            // Blur Background
            ctx.save();
            ctx.filter = 'blur(18px) brightness(0.6)';
            ctx.drawImage(videoElement, -100, -100, 1600, 1150);
            ctx.restore();

            // Foto Utama Tengah
            const photoX = 150, photoY = 80, photoWidth = 1100, photoHeight = 670;
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 30;
            ctx.shadowOffsetY = 15;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(photoX, photoY, photoWidth, photoHeight);
            ctx.restore();

            ctx.save();
            ctx.beginPath();
            ctx.rect(photoX + 15, photoY + 15, photoWidth - 30, photoHeight - 30);
            ctx.clip();
            ctx.translate(photoX + photoWidth, photoY);
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, 15, 15, photoWidth - 30, photoHeight - 30);
            ctx.restore();

            // Footer Bar
            const footerX = 150, footerY = 770, footerWidth = 1100, footerHeight = 110;
            ctx.fillStyle = '#4a1525';
            ctx.fillRect(footerX, footerY, footerWidth, footerHeight);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 2;
            ctx.strokeRect(footerX, footerY, footerWidth, footerHeight);

            ctx.fillStyle = '#fef3c7';
            ctx.font = '16px Inter, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(document.getElementById('footerLeftText').value || "Sabtu, 03 Oktober 2026", footerX + 40, footerY + 62);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 26px Outfit, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(document.getElementById('footerCenterText').value || "The Wedding of Firdha & Halim", footerX + (footerWidth / 2), footerY + 65);

            ctx.fillStyle = '#fef3c7';
            ctx.font = '14px Inter, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText("Pi U Live Booth", footerX + footerWidth - 40, footerY + 62);

            const dataURL = hiddenSnapshotCanvas.toDataURL('image/jpeg', 0.95);
            const photoObj = {
                id: 'PHOTO-' + Date.now(),
                url: dataURL,
                time: new Date().toLocaleTimeString()
            };

            capturedPhotosList.unshift(photoObj);
            localStorage.setItem('shared_event_photos', JSON.stringify(capturedPhotosList));
            renderGalleryFeed();
        }

        function renderGalleryFeed() {
            photoCountBadge.innerText = capturedPhotosList.length;
            if (capturedPhotosList.length > 0) emptyFeedState.classList.add('hidden');

            galleryStreamContainer.innerHTML = '';
            capturedPhotosList.forEach((photo) => {
                const card = document.createElement('div');
                card.className = "relative rounded-2xl overflow-hidden aspect-[4/3] border border-slate-200 dark:border-slate-800 shadow-xs group bg-slate-100 cursor-pointer";
                card.onclick = () => openLightbox(photo.url);
                card.innerHTML = `
                    <img src="${photo.url}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-semibold gap-1">
                        <i class="fa-solid fa-magnifying-glass-plus"></i> Perbesar
                    </div>
                `;
                galleryStreamContainer.appendChild(card);
            });
        }

        function loadGuestPhotosFromStorage() {
            const saved = localStorage.getItem('shared_event_photos');
            if (saved) capturedPhotosList = JSON.parse(saved);
            
            const grid = document.getElementById('guestGalleryGrid');
            grid.innerHTML = '';

            if (capturedPhotosList.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-12">Belum ada foto yang diunggah ke galeri acara.</p>`;
                return;
            }

            capturedPhotosList.forEach(photo => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 p-2.5 rounded-2xl shadow-lg border border-slate-800 flex flex-col gap-2 cursor-pointer group";
                card.onclick = () => openLightbox(photo.url);
                card.innerHTML = `
                    <div class="relative overflow-hidden rounded-xl aspect-[4/3]">
                        <img src="${photo.url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-semibold gap-1.5">
                            <i class="fa-solid fa-expand"></i> Klik untuk Zoom
                        </div>
                    </div>
                    <div class="flex items-center justify-between px-1">
                        <span class="text-[10px] text-slate-400">${photo.time}</span>
                        <a href="${photo.url}" download="${photo.id}.jpg" onclick="event.stopPropagation()" class="px-3 py-1 bg-violet-600 hover:bg-violet-700 text-white rounded-lg text-xs font-medium transition shadow">
                            <i class="fa-solid fa-download"></i>
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Fungsi Lightbox Zoom
        function openLightbox(imageUrl) {
            document.getElementById('lightboxImage').src = imageUrl;
            document.getElementById('lightboxDownloadBtn').href = imageUrl;
            document.getElementById('lightboxModal').classList.remove('hidden');
            document.getElementById('lightboxModal').classList.add('flex');
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.remove('flex');
            document.getElementById('lightboxModal').classList.add('hidden');
        }

        function openQrModal(photoId) {
            activePhotoForQr = capturedPhotosList.find(p => p.id === photoId);
            if (!activePhotoForQr) return;
            const qrcodeBox = document.getElementById('qrcodeBox');
            qrcodeBox.innerHTML = '';
            new QRCode(qrcodeBox, { text: activePhotoForQr.url, width: 160, height: 160 });
            document.getElementById('qrModal').classList.remove('hidden');
            document.getElementById('qrModal').classList.add('flex');
        }

        function closeQrModal() {
            document.getElementById('qrModal').classList.remove('flex');
            document.getElementById('qrModal').classList.add('hidden');
        }

        function downloadSinglePhoto() {
            if (!activePhotoForQr) return;
            const link = document.createElement('a');
            link.download = `${activePhotoForQr.id}.jpg`;
            link.href = activePhotoForQr.url;
            link.click();
        }
    </script>
</body>
</html>
